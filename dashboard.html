<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Napkin Math Dreams — Daily Benchmarks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; background: #fff; color: #222; padding: 20px; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }
    .controls { margin-bottom: 16px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .controls label { display: inline-flex; align-items: center; gap: 4px; }
    .controls select { font-family: monospace; font-size: 13px; }
    .controls button { font-family: monospace; font-size: 13px; background: #f5f5f5; border: 1px solid #ccc; padding: 2px 10px; cursor: pointer; }
    .controls button:hover { background: #e8e8e8; }
    .chart-section { margin-bottom: 32px; border-bottom: 1px solid #e0e0e0; padding-bottom: 24px; }
    .chart-section:last-child { border-bottom: none; }
    .chart-title { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
    .chart-meta { font-size: 12px; color: #888; margin-bottom: 8px; }
    canvas { display: block; }
    .tooltip { position: absolute; background: #fff; border: 1px solid #ccc; padding: 6px 10px; font-family: monospace; font-size: 12px; pointer-events: none; display: none; z-index: 10; box-shadow: 1px 1px 4px rgba(0,0,0,0.1); }
    #status { font-size: 13px; color: #888; margin-bottom: 16px; }
    a { color: #222; }
  </style>
</head>
<body>
  <h1>Napkin Math Dreams</h1>
  <p class="subtitle">
    <a href="https://github.com/aatran14/napkin-math-dreams">github.com/aatran14/napkin-math-dreams</a>
    &mdash; daily measurements on real hardware
  </p>

  <div class="controls">
    <label>Machine: <select id="machine-select"><option value="__all__">All</option></select></label>
    <label>Operation: <select id="operation-select"><option value="__all__">All</option></select></label>
    <label>Config: <select id="config-select"><option value="__all__">All</option></select></label>
    <button id="download-btn">Download CSV</button>
  </div>

  <p id="status">Loading...</p>
  <div id="charts"></div>
  <div class="tooltip" id="tooltip"></div>

  <script>
    var COLORS = ["#e45", "#28a", "#2a6", "#f80", "#a4e", "#0ac", "#c54", "#6a4"];
    var DPR = window.devicePixelRatio || 1;
    var CHART_W = 1060;
    var CHART_H = 220;
    var PAD = { top: 20, right: 20, bottom: 36, left: 80 };

    var OP_META = {
      seq_mem_read_single:  { label: "Sequential Memory Read (single thread, 64B)", metrics: ["throughput", "latency"] },
      seq_mem_read_threaded:{ label: "Sequential Memory Read (threaded, 64B)",       metrics: ["throughput"] },
      mem_random_rw:        { label: "Random Memory R/W (64B)",                      metrics: ["throughput", "latency"] },
      hash_non_crypto:      { label: "Hashing, non-crypto (64B)",                    metrics: ["throughput", "latency"] },
      hash_crypto:          { label: "Hashing, crypto-safe (64B)",                   metrics: ["throughput", "latency"] },
      syscall:              { label: "System Call",                                   metrics: ["latency"] },
      context_switch:       { label: "Context Switch",                               metrics: ["latency"] },
      ssd_read_seq:         { label: "Sequential SSD Read (8 KiB)",                  metrics: ["throughput", "latency"] },
      ssd_read_random:      { label: "Random SSD Read (8 KiB)",                      metrics: ["throughput", "latency"] },
      ssd_write_no_fsync:   { label: "Sequential SSD Write -fsync (8 KiB)",          metrics: ["throughput", "latency"] },
      ssd_write_fsync:      { label: "Sequential SSD Write +fsync (8 KiB)",          metrics: ["throughput", "latency"] },
      tcp_echo:             { label: "TCP Echo Server (32 KiB)",                     metrics: ["throughput", "latency"] },
      sort_64bit:           { label: "Sorting (64-bit integers)",                    metrics: ["throughput"] },
      compression:          { label: "Compression",                                  metrics: ["throughput"] },
      decompression:        { label: "Decompression",                                metrics: ["throughput"] },
      serialization_fast:   { label: "Fast Serialization",                           metrics: ["throughput"] },
      deserialization_fast: { label: "Fast Deserialization",                          metrics: ["throughput"] },
      serialization:        { label: "Serialization",                                metrics: ["throughput"] },
      deserialization:      { label: "Deserialization",                               metrics: ["throughput"] }
    };

    var state = { rows: [], operations: [], machines: [], configs: [] };
    var tooltip = document.getElementById("tooltip");

    document.getElementById("machine-select").addEventListener("change", render);
    document.getElementById("operation-select").addEventListener("change", render);
    document.getElementById("config-select").addEventListener("change", render);
    document.getElementById("download-btn").addEventListener("click", downloadCSV);

    load();

    function load() {
      document.getElementById("status").textContent = "Loading...";
      fetch("data/dead.csv", { cache: "no-store" })
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function(text) { parse(text); render(); })
        .catch(function(e) { document.getElementById("status").textContent = "Failed: " + e.message; });
    }

    function parse(text) {
      var lines = text.replace(/^\xEF\xBB\xBF/, "").split(/\r?\n/).filter(function(l) { return l.trim(); });
      var headers = lines[0].split(",");
      var rows = [];
      for (var i = 1; i < lines.length; i++) {
        var cells = lines[i].split(",");
        var row = {};
        for (var j = 0; j < headers.length; j++) row[headers[j].trim()] = (cells[j] || "").trim();
        rows.push(row);
      }
      state.rows = rows;

      var ops = {}, machines = {}, configs = {};
      for (var i = 0; i < rows.length; i++) {
        ops[rows[i].operation] = true;
        machines[rows[i].machine] = true;
        if (rows[i].config) configs[rows[i].config] = true;
      }
      state.operations = Object.keys(ops);
      state.machines = Object.keys(machines);
      state.configs = Object.keys(configs);

      populateSelect("machine-select", state.machines);
      populateSelect("config-select", state.configs);
      populateOperationSelect();
    }

    function populateSelect(id, values) {
      var sel = document.getElementById(id);
      sel.innerHTML = '<option value="__all__">All</option>';
      values.forEach(function(v) {
        var o = document.createElement("option");
        o.value = v; o.textContent = v;
        sel.appendChild(o);
      });
    }

    function populateOperationSelect() {
      var sel = document.getElementById("operation-select");
      sel.innerHTML = '<option value="__all__">All</option>';
      state.operations.forEach(function(op) {
        var o = document.createElement("option");
        o.value = op;
        o.textContent = OP_META[op] ? OP_META[op].label : op;
        sel.appendChild(o);
      });
    }

    function getFilteredRows() {
      var mf = document.getElementById("machine-select").value;
      var of_ = document.getElementById("operation-select").value;
      var cf = document.getElementById("config-select").value;
      return state.rows.filter(function(r) {
        if (mf !== "__all__" && r.machine !== mf) return false;
        if (of_ !== "__all__" && r.operation !== of_) return false;
        if (cf !== "__all__" && r.config !== cf) return false;
        return true;
      });
    }

    function downloadCSV() {
      var filtered = getFilteredRows();
      if (!filtered.length) return;
      var header = "date,machine,config,operation,latency_ns,throughput_bytes_s\n";
      var body = filtered.map(function(r) {
        return [r.date, r.machine, r.config || "", r.operation, r.latency_ns || "", r.throughput_bytes_s || ""].join(",");
      }).join("\n");
      var blob = new Blob([header + body], { type: "text/csv" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "napkin-math.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function render() {
      var filtered = getFilteredRows();
      var opFilter = document.getElementById("operation-select").value;
      var container = document.getElementById("charts");
      container.innerHTML = "";

      var opsToShow = opFilter !== "__all__" ? [opFilter] : state.operations;
      var chartCount = 0;

      opsToShow.forEach(function(op) {
        var opRows = filtered.filter(function(r) { return r.operation === op; });
        if (!opRows.length) return;

        var meta = OP_META[op] || { label: op, metrics: guessMetrics(opRows) };

        var seriesKeys = {};
        opRows.forEach(function(r) {
          var key = r.config ? r.machine + " / " + r.config : r.machine;
          seriesKeys[key] = true;
        });
        var seriesList = Object.keys(seriesKeys);

        meta.metrics.forEach(function(metric) {
          var hasData = opRows.some(function(r) {
            var v = metric === "throughput" ? r.throughput_bytes_s : r.latency_ns;
            return v !== "" && v !== undefined;
          });
          if (!hasData) return;

          var section = document.createElement("div");
          section.className = "chart-section";

          var title = document.createElement("div");
          title.className = "chart-title";
          title.textContent = meta.label + " — " + metric;
          section.appendChild(title);

          var metaEl = document.createElement("div");
          metaEl.className = "chart-meta";
          metaEl.textContent = seriesList.join(", ");
          section.appendChild(metaEl);

          var canvas = document.createElement("canvas");
          canvas.width = CHART_W * DPR;
          canvas.height = CHART_H * DPR;
          canvas.style.width = CHART_W + "px";
          canvas.style.height = CHART_H + "px";
          section.appendChild(canvas);
          container.appendChild(section);

          drawChart(canvas, opRows, seriesList, metric);
          chartCount++;
        });
      });

      document.getElementById("status").textContent = chartCount + " charts — " + filtered.length + " data points";
    }

    function guessMetrics(opRows) {
      var metrics = [];
      if (opRows.some(function(r) { return r.latency_ns && r.latency_ns !== ""; })) metrics.push("latency");
      if (opRows.some(function(r) { return r.throughput_bytes_s && r.throughput_bytes_s !== ""; })) metrics.push("throughput");
      return metrics.length ? metrics : ["throughput"];
    }

    function drawChart(canvas, opRows, seriesList, metric) {
      var ctx = canvas.getContext("2d");
      ctx.scale(DPR, DPR);

      var plotW = CHART_W - PAD.left - PAD.right;
      var plotH = CHART_H - PAD.top - PAD.bottom;

      var seriesData = [];
      var allValues = [];
      var allDates = [];
      seriesList.forEach(function(key, ki) {
        var pts = opRows
          .filter(function(r) {
            var k = r.config ? r.machine + " / " + r.config : r.machine;
            return k === key;
          })
          .map(function(r) {
            var v = metric === "throughput" ? parseFloat(r.throughput_bytes_s) : parseFloat(r.latency_ns);
            return { date: r.date, value: v };
          })
          .filter(function(p) { return isFinite(p.value); })
          .sort(function(a, b) { return a.date < b.date ? -1 : 1; });
        seriesData.push({ key: key, points: pts, color: COLORS[ki % COLORS.length] });
        pts.forEach(function(p) { allValues.push(p.value); allDates.push(p.date); });
      });

      if (!allValues.length) return;

      allDates = Array.from(new Set(allDates)).sort();
      var vMin = Math.min.apply(null, allValues);
      var vMax = Math.max.apply(null, allValues);
      if (vMin === vMax) { vMin *= 0.9; vMax *= 1.1; }
      var vPad = (vMax - vMin) * 0.08;
      vMin -= vPad; vMax += vPad;
      if (vMin < 0) vMin = 0;

      var dateToX = function(d) {
        var i = allDates.indexOf(d);
        return PAD.left + (i / Math.max(1, allDates.length - 1)) * plotW;
      };
      var valToY = function(v) {
        return PAD.top + plotH - ((v - vMin) / (vMax - vMin)) * plotH;
      };

      ctx.strokeStyle = "#e8e8e8";
      ctx.lineWidth = 1;
      var nTicks = 5;
      for (var i = 0; i <= nTicks; i++) {
        var y = PAD.top + (i / nTicks) * plotH;
        ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + plotW, y); ctx.stroke();
      }

      ctx.fillStyle = "#888";
      ctx.font = "11px monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (var i = 0; i <= nTicks; i++) {
        var v = vMax - (i / nTicks) * (vMax - vMin);
        var y = PAD.top + (i / nTicks) * plotH;
        ctx.fillText(formatValue(v, metric), PAD.left - 6, y);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      var step = Math.max(1, Math.floor(allDates.length / 8));
      for (var i = 0; i < allDates.length; i += step) {
        var x = dateToX(allDates[i]);
        ctx.fillText(allDates[i].slice(5), x, PAD.top + plotH + 4);
      }

      seriesData.forEach(function(s) {
        if (s.points.length < 2) {
          ctx.fillStyle = s.color;
          s.points.forEach(function(p) {
            var x = dateToX(p.date), y = valToY(p.value);
            ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
          });
          return;
        }
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        s.points.forEach(function(p, i) {
          var x = dateToX(p.date), y = valToY(p.value);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();

        ctx.fillStyle = s.color;
        s.points.forEach(function(p) {
          var x = dateToX(p.date), y = valToY(p.value);
          ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
        });
      });

      if (seriesData.length > 1) {
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = "11px monospace";
        seriesData.forEach(function(s, i) {
          var lx = PAD.left + 8, ly = PAD.top + 4 + i * 14;
          ctx.fillStyle = s.color;
          ctx.fillRect(lx, ly + 2, 10, 10);
          ctx.fillStyle = "#444";
          ctx.fillText(s.key, lx + 14, ly);
        });
      }

      canvas.addEventListener("mousemove", function(e) {
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;
        var best = null, bestDist = 20;
        seriesData.forEach(function(s) {
          s.points.forEach(function(p) {
            var x = dateToX(p.date), y = valToY(p.value);
            var d = Math.sqrt((mx - x) * (mx - x) + (my - y) * (my - y));
            if (d < bestDist) { bestDist = d; best = { x: x, y: y, date: p.date, value: p.value, key: s.key, color: s.color }; }
          });
        });
        if (best) {
          tooltip.style.display = "block";
          tooltip.style.left = (rect.left + best.x + 12 + window.scrollX) + "px";
          tooltip.style.top = (rect.top + best.y - 10 + window.scrollY) + "px";
          tooltip.innerHTML = best.date + "<br>" + best.key + "<br><b>" + formatValue(best.value, metric) + "</b>";
        } else {
          tooltip.style.display = "none";
        }
      });
      canvas.addEventListener("mouseleave", function() { tooltip.style.display = "none"; });
    }

    function formatValue(v, metric) {
      if (metric === "throughput") {
        if (v >= 1073741824) return (v / 1073741824).toFixed(1) + " GiB/s";
        if (v >= 1048576) return (v / 1048576).toFixed(1) + " MiB/s";
        if (v >= 1024) return (v / 1024).toFixed(1) + " KiB/s";
        return v.toFixed(0) + " B/s";
      } else {
        if (v >= 1000000000) return (v / 1000000000).toFixed(2) + " s";
        if (v >= 1000000) return (v / 1000000).toFixed(2) + " ms";
        if (v >= 1000) return (v / 1000).toFixed(2) + " us";
        return v.toFixed(2) + " ns";
      }
    }
  </script>
</body>
</html>
