<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Napkin Math Dreams</title>
  <link rel="stylesheet" href="style.css">
  <!-- INJECT_DATA -->
</head>
<body>
  <div class="page-shell">
    <div class="page-stack">
      <header class="page-header">
        <div class="page-header-row">
          <h1>Napkin Math Dreams</h1>
          <div class="machine-bar">
            <div class="machine-picker" id="machine-picker">
              <button type="button" class="picker-trigger" id="picker-trigger" aria-expanded="false" aria-controls="picker-menu">
                <span class="picker-icon" aria-hidden="true">☰</span>
                <span class="picker-label" id="picker-label">Machine</span>
              </button>
              <div class="picker-menu" id="picker-menu">
                <div id="picker-lattice"></div>
                <div class="picker-section" id="picker-other-heading" hidden>Other</div>
                <div class="picker-list" id="picker-list-other"></div>
              </div>
            </div>
          </div>
        </div>
        <p id="bench-error" class="note" hidden></p>
      </header>
      <div class="page-table-col">
        <div id="charts">
          <table id="bench-table">
            <colgroup>
              <col class="col-shrink" span="5">
              <col class="col-trend">
            </colgroup>
            <thead>
              <tr>
                <th>Operation</th>
                <th>Latency</th>
                <th>Throughput</th>
                <th>1 MiB</th>
                <th>1 GiB</th>
                <th class="trend-col">Trend</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="changelog" hidden></div>
      </div>
      <div class="page-toc-slot">
        <nav id="bench-toc" class="page-toc" aria-label="Sections" hidden>
          <div id="bench-toc-indicator" class="page-toc-indicator" hidden></div>
        </nav>
      </div>
    </div>
  </div>
  <div id="spark-popover" hidden>
    <div class="title" id="spark-popover-title"></div>
    <div id="spark-popover-body"></div>
  </div>
  <div id="spark-popover-2" hidden>
    <div class="title" id="spark-popover-title-2"></div>
    <div id="spark-popover-body-2"></div>
  </div>
  <script src="js/dashboard.js?v=53"></script>
</body>
</html>
