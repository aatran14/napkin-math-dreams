name: Nightly Benchmarks

# Code lives on master (this branch). Site + data live on gh-pages.
# Runs the GCP + AWS fleets from the master checkout, then publishes data + index.html to gh-pages.
# Auth: GCP service-account key (GCP_SA_KEY) + AWS keys (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SSH_PRIVATE_KEY).
#
# The `daily` binary is built here on native runners and shipped to the benchmark
# machines. Those machines therefore need no compiler, no rustup and no apt at
# all, which removes the failure that used to cost us whole nights: the Ubuntu
# arm64 ports mirror 503ing during `apt-get install build-essential`.
#
# NOTE: must live on the DEFAULT branch (master) for the schedule to fire.

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 03:00 America/Los_Angeles (PDT)
  workflow_dispatch: {}

permissions:
  contents: write # push results back to gh-pages

concurrency:
  group: nightly-bench
  cancel-in-progress: false

env:
  GCP_ZONE: ${{ vars.GCP_ZONE || 'us-east1-b' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  # The fleet, in one place, so the run step and the retry pass can't disagree
  # about which machines are supposed to report.
  GCP_MACHINES: c4-standard-48-lssd c4d-standard-48-lssd c4a-standard-48-lssd
  AWS_MACHINES: c7i.12xlarge c7a.12xlarge c7g.12xlarge
  NET_PROBE_GCP: c4-standard-48-lssd
  NET_PROBE_AWS: c7i.12xlarge

jobs:
  # Native builds, so there is no cross-compilation to get wrong. The runner
  # image and the benchmark VMs are both Ubuntu 24.04, so glibc matches.
  # A break here costs nothing: no cloud resource is touched until this passes.
  build:
    name: Build daily (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The whole night now hangs off this job, so a mirror 503 here must not be
      # the end of it.
      - name: Install build deps
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update -qq \
              && sudo apt-get install -y -qq build-essential pkg-config libssl-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::apt failed 5 times, cannot build"
          exit 1

      - name: Build daily
        run: cargo build --release --bin daily

      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ matrix.arch }}
          path: target/release/daily
          if-no-files-found: error
          retention-days: 7

  benchmark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout master (code)
        uses: actions/checkout@v4

      - name: Checkout gh-pages (existing data + publish target)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Fetch prebuilt daily binaries
        uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Make binaries executable
        run: |
          set -euo pipefail
          chmod +x bin/daily-amd64/daily bin/daily-arm64/daily
          file bin/daily-amd64/daily bin/daily-arm64/daily

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/napkin-bench.pem
          chmod 600 ~/.ssh/napkin-bench.pem

      - name: Seed historical data into the code checkout
        run: |
          mkdir -p data
          cp -f site/data/*.csv data/ 2>/dev/null || true
          cp -f site/data/changelog.json data/ 2>/dev/null || true

      - name: Run GCP + AWS fleets (compute + same-zone network)
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1" # don't block on ssh-key prompts in CI
          AWS_KEY_FILE: ~/.ssh/napkin-bench.pem
          NAPKIN_BIN_DIR: bin
        run: |
          set -euo pipefail
          : > data/dead.csv             # capture only this run's rows
          : > data/failed-machines.txt  # one line per machine that failed
          # A fleet only exits non-zero when every one of its machines failed;
          # that shouldn't stop the other cloud from running.
          NAPKIN_GCP_ZONE="$GCP_ZONE" bash machines/bench-gcp-fleet.sh $GCP_MACHINES || true
          bash machines/bench-aws-fleet.sh $AWS_MACHINES || true
          # Zone stockouts are the usual remaining failure and they clear on their
          # own, so give the missing machines one more shot.
          NAPKIN_GCP_ZONE="$GCP_ZONE" bash machines/retry-failed.sh
          # same-zone network: one matched VM pair per cloud (NIC is identical across
          # c4/c4d/c4a, so one pair suffices). Appends network_inside_vpc* and
          # network_outside_vpc* rows to dead.csv.
          NAPKIN_GCP_ZONE="$GCP_ZONE" bash machines/bench-net-fleet-gcp.sh $NET_PROBE_GCP || echo "::warning::GCP net probe failed; keeping compute data"
          bash machines/bench-net-fleet-aws.sh $NET_PROBE_AWS || echo "::warning::AWS net probe failed; keeping compute data"

      - name: Publish results to gh-pages
        run: |
          set -euo pipefail
          if [ ! -s data/dead.csv ]; then
            echo "::error::no machine produced results, nothing to publish"
            exit 1
          fi
          TODAY=$(date -u +%Y-%m-%d)
          {
            echo 'date,machine,cpu,config,operation,latency_ns,throughput_bytes_s,commit'
            cat data/dead.csv
          } > "data/${TODAY}.csv"
          python3 scripts/publish.py          # reads data/ + web/ -> writes data/data.csv + index.html
          cp -f data/*.csv site/data/
          cp -f index.html site/index.html
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "bench: ${TODAY} results"
          git push origin gh-pages

      - name: Report machines missing from this run
        if: always()
        run: |
          if [ ! -s data/failed-machines.txt ]; then
            echo "All machines reported." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Machines missing from this run" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r cloud machine status || [ -n "${cloud:-}" ]; do
            [ -n "${machine:-}" ] || continue
            echo "::warning::$cloud $machine failed twice, no data tonight (exit $status)"
            echo "- \`$cloud $machine\` exit $status" >> "$GITHUB_STEP_SUMMARY"
          done < data/failed-machines.txt
